[project]
name = "local-git-rag"
version = "0.1.0"
description = "Pure-local RAG service for Git repositories"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "orjson>=3.11,<4",
    "pathspec>=0.12,<1",
    "prometheus-client>=0.22,<1",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0,<7",
    "qdrant-client>=1.15,<2",
    "structlog>=25.4,<26",
    "tenacity>=9.1,<10",
    "tree-sitter>=0.25,<0.26",
    "typer>=0.16,<1",
    "ulid-py>=1.1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ragctl = "rag.cli.main:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", ".venv", "data"]

[tool.ruff.lint.per-file-ignores]
"src/rag/api/*.py" = ["B008"]
"src/rag/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
